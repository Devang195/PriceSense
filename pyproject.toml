[project]
name = "pricesense"
version = "2.3.0"
description = "Retail price forecasting with FastAPI and a zero-build web frontend"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.128.2",
    "uvicorn==0.48.0",
    "python-multipart==0.0.29",
    "pandas==2.2.3",
    "numpy==2.3.5",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "statsmodels==0.14.6",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1"]
